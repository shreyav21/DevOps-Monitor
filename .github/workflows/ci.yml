name: CI Pipeline
on:
  push: 
    branches:
      -main
    pull_request:
      branches:
        -main
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      -name: Checkout Repository
       uses: actions/checkout@v4

      -name: Set up Java 21
       uses: actions/setup-java@v4
       with:
        distribution: temurin
        java-version: '21'

      -name: Build Backend
       working-directory: backend 
       run: mvn clean package -DskipTests

      -name: Build Frontend
       working-directory: frontend 
       run: npm run build
