spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://postgres:5432/devops_monitor
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: true

    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: "*"


  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: devops-monitor
  prometheus:
    metrics:
      export:
        enabled: true

info:
  app:
    name: DevOps-Monitor
    version: 1.0.0
    description: DevOps Monitoring Dashboard

server:
  port: 8080